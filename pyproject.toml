[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "telegram-readonly-mcp"
version = "0.1.0"
description = "Local, guarded read-only Telegram MCP using MTProto"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "telethon==1.45.0",
  "mcp==1.30.0",
  "python-dotenv==1.2.4",
  "uvicorn>=0.30,<1",
  "pywin32==312; sys_platform == 'win32'",
]

[project.optional-dependencies]
dev = ["pytest>=9,<10", "pytest-asyncio>=1.4,<2", "ruff>=0.16,<1", "httpx>=0.28,<1"]

[project.scripts]
telegram-readonly-mcp = "telegram_readonly_mcp.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/telegram_readonly_mcp"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
