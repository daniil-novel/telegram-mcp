services:
  telegram:
    build: .
    env_file: .env
    environment:
      TELEGRAM_SESSION_DIR: /home/app/.local/share/telegram-readonly-mcp
    ports:
      - "127.0.0.1:8765:8765"
    volumes:
      - telegram-session:/home/app/.local/share/telegram-readonly-mcp
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    init: true
    restart: "no"
volumes:
  telegram-session:
